<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>打开歌曲 · 网易云音乐</title>
  <style>
    :root { --red: #d33a31; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 30% 20%, #3b1010, #1a0a0a 60%, #120606);
      color: #fff;
    }
    .card {
      width: min(420px, 92vw);
      padding: 48px 40px;
      text-align: center;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      backdrop-filter: blur(12px);
    }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 22px;
      border-radius: 20px;
      background: var(--red);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 32px rgba(211,58,49,.4);
      font-size: 34px;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    .sub { color: rgba(255,255,255,.5); font-size: 13px; margin-bottom: 26px; }
    .status { min-height: 20px; font-size: 13px; color: rgba(255,255,255,.55); }
    .status.good { color: #7ee2a0; }
    .status.warn { color: #ffb4a9; }
    .links { margin-top: 22px; font-size: 12.5px; display: flex; gap: 18px; justify-content: center; }
    .links a { color: #ff8d84; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🎵</div>
    <h1>正在打开音乐客户端</h1>
    <p class="sub">歌曲 ID 3346496288 · 失败将自动跳转网页版</p>
    <div class="status" id="status">正在尝试唤起本地客户端…</div>
    <div class="links">
      <a href="#" id="retry">重试客户端</a>
      <a href="https://music.163.com/song?id=3346496288" target="_blank" rel="noopener">直接打开网页版</a>
    </div>
  </main>
  <script>
    const SONG_ID = '3346496288';
    const WEB_URL = `https://music.163.com/song?id=${SONG_ID}`;
    const APPS = [
      { name: '网易云音乐', scheme: `orpheus://song/${SONG_ID}` },
      { name: 'QQ音乐', scheme: 'qqmusic://' },
      { name: '酷狗音乐', scheme: 'kugou://' }
    ];
    const WAIT = 2000;
    const status = document.getElementById('status');
    let running = false, done = false;

    function fire(scheme) {
      const a = document.createElement('a');
      a.href = scheme;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => a.remove(), 200);
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // 窗口失焦且持续未恢复，视为某个客户端已接管；页面上不展示逐个尝试过程
    function engaged() { return document.hidden || !document.hasFocus(); }

    async function tryAll() {
      if (running || done) return;
      running = true;
      status.className = 'status';
      status.textContent = '正在尝试唤起本地客户端…';
      for (const app of APPS) {
        fire(app.scheme);
        const t0 = Date.now();
        while (Date.now() - t0 < WAIT) {
          await sleep(150);
          if (engaged()) {
            await sleep(1200);
            if (engaged()) {
              done = true;
              running = false;
              status.className = 'status good';
              status.textContent = `已拉起 ${app.name}`;
              return;
            }
          }
        }
      }
      running = false;
      done = true;
      status.className = 'status warn';
      status.textContent = '未检测到本地客户端，正在跳转网页版…';
      await sleep(600);
      window.location.replace(WEB_URL);
    }

    document.getElementById('retry').addEventListener('click', e => {
      e.preventDefault();
      done = false;
      tryAll();
    });

    // 无用户手势时浏览器可能拦截协议跳转，首次交互时补跑一次
    window.addEventListener('load', tryAll);
    ['pointerdown', 'keydown'].forEach(ev =>
      window.addEventListener(ev, () => { if (!done) tryAll(); }, { once: true }));
  </script>
</body>
</html>
