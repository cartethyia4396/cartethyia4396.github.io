<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>打开音乐</title>
  <style>html,body{height:100%;background:#120606}</style>
</head>
<body>
  <script>
    const SONG_ID = '3346496288';
    const WEB_URL = `https://music.163.com/song?id=${SONG_ID}`;
    const APPS = [
      `orpheus://song/${SONG_ID}`,
      'qqmusic://',
      'kugou://'
    ];
    const WAIT = 2000;
    let running = false, done = false;

    function fire(scheme) {
      const a = document.createElement('a');
      a.href = scheme;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => a.remove(), 200);
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function engaged() { return document.hidden || !document.hasFocus(); }

    async function tryAll() {
      if (running || done) return;
      running = true;
      for (const scheme of APPS) {
        fire(scheme);
        const t0 = Date.now();
        while (Date.now() - t0 < WAIT) {
          await sleep(150);
          if (engaged()) {
            await sleep(1200);
            if (engaged()) {
              done = true;
              running = false;
              return;
            }
          }
        }
      }
      running = false;
      done = true;
      window.location.replace(WEB_URL);
    }

    // 无用户手势时浏览器可能拦截协议跳转，首次交互时补跑一次
    window.addEventListener('load', tryAll);
    ['pointerdown', 'keydown'].forEach(ev =>
      window.addEventListener(ev, () => { if (!done) tryAll(); }, { once: true }));
  </script>
</body>
</html>
