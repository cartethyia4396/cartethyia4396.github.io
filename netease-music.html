<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拉起网易云音乐</title>
  <style>
    :root { --red: #d33a31; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 30% 20%, #3b1010, #1a0a0a 60%, #120606);
      color: #fff;
    }
    .card {
      width: min(420px, 90vw);
      padding: 48px 40px;
      text-align: center;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      backdrop-filter: blur(12px);
    }
    .logo {
      width: 84px; height: 84px; margin: 0 auto 24px;
      border-radius: 22px;
      background: var(--red);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 32px rgba(211,58,49,.4);
      font-size: 40px;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: rgba(255,255,255,.55); font-size: 14px; margin-bottom: 32px; }
    .btn {
      display: block;
      padding: 14px 0;
      border-radius: 999px;
      background: var(--red);
      color: #fff; text-decoration: none; font-size: 16px;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 8px 24px rgba(211,58,49,.35);
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .status { min-height: 20px; margin-top: 16px; font-size: 13px; color: rgba(255,255,255,.5); }
    .status.warn { color: #ffb4a9; }
    .alt { margin-top: 20px; font-size: 13px; }
    .alt a { color: #ff8d84; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🎵</div>
    <h1>网易云音乐</h1>
    <p>点击按钮唤起本地桌面客户端</p>
    <a class="btn" id="launch" href="orpheus://">打开客户端</a>
    <div class="status" id="status"></div>
    <div class="alt" id="alt" hidden>
      没反应？<a href="https://music.163.com" target="_blank" rel="noopener">使用网页版 →</a>
    </div>
  </main>
  <script>
    const status = document.getElementById('status');
    const alt = document.getElementById('alt');
    let launched = false;

    document.getElementById('launch').addEventListener('click', () => {
      launched = false;
      alt.hidden = true;
      status.classList.remove('warn');
      status.textContent = '正在唤起客户端，请在浏览器弹窗中点击「打开」…';
      setTimeout(() => {
        if (!launched) {
          status.textContent = '未检测到客户端，请确认本机已安装网易云音乐桌面版';
          status.classList.add('warn');
          alt.hidden = false;
        }
      }, 2500);
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) launched = true;
    });
  </script>
</body>
</html>
